name: 테스트

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          pip install -r requirements.txt --break-system-packages || pip install -r requirements.txt
          pip install pytest
      - name: 테스트 실행
        run: pytest tests/ -v
