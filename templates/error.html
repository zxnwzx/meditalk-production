{% extends "base.html" %}
{% block title %}{{ code }} | 메디톡{% endblock %}
{% block robots %}noindex, nofollow{% endblock %}
{% block content %}
<div class="wrap error-page">
  <div class="error-code">{{ code }}</div>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn">홈으로 돌아가기</a>
</div>
{% endblock %}
