{% from "_icons.html" import eye_open, eye_closed %}
{% extends "base.html" %}
{% block title %}로그인 | 메디톡{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="auth-wrap">
    <h2>로그인</h2>
    <p class="sub">메디톡 계정으로 계속하세요.</p>
    <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required>
          <button type="button" class="password-toggle-btn" data-password-toggle="password" aria-label="비밀번호 표시/숨기기">
            <span class="icon-eye-open">{{ eye_open() }}</span><span class="icon-eye-closed" hidden>{{ eye_closed() }}</span>
          </button>
        </div>
      </div>
      <button class="btn" type="submit" style="width:100%;">로그인</button>
    </form>
    <p class="auth-alt">아직 계정이 없으신가요? <a href="{{ url_for('signup') }}">회원가입</a></p>
  </div>
</div>
{% endblock %}
