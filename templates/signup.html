{% from "_icons.html" import eye_open, eye_closed %}
{% extends "base.html" %}
{% block title %}회원가입 | 메디톡{% endblock %}
{% block content %}
<div class="auth-layout">
  <div class="auth-wrap">
    <h2>독자 회원가입</h2>
    <p class="sub">뉴스레터 구독과 기사 스크랩 기능을 이용하실 수 있습니다. 기자 계정은 편집국에서 개설합니다.</p>
    <form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" required autofocus>
      </div>
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required minlength="8">
          <button type="button" class="password-toggle-btn" data-password-toggle="password" aria-label="비밀번호 표시/숨기기">
            <span class="icon-eye-open">{{ eye_open() }}</span><span class="icon-eye-closed" hidden>{{ eye_closed() }}</span>
          </button>
        </div>
      </div>
      <button class="btn" type="submit" style="width:100%;">가입하기</button>
    </form>
    <p class="auth-alt">이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
  </div>
</div>
{% endblock %}
